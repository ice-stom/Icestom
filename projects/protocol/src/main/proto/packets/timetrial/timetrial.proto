syntax = "proto3";

package icestom.packets.timetrial;

option java_package = "io.gitlab.icestom.protocol.packets.timetrial";
option java_multiple_files = true;

import "packets/timetrial/clientbound/pbline.proto";

message ClientboundTimetrial {
  oneof payload {
    icestom.packets.timetrial.clientbound.ServerPBLine pbLine = 1;
  }
}